    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Restaurant Menu</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <main class="py-4">
  <div class="container">
    <h2 class="text-center mb-3">Today's Menu</h2>
    <div class="row">
      <div class="col-md-8">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th class="text-end">Price</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Margherita Pizza</td><td>Vegetarian</td><td class="text-end">₹250</td></tr>
            <tr><td>Grilled Chicken</td><td>Non-Veg</td><td class="text-end">₹320</td></tr>
            <tr><td>Caesar Salad</td><td>Starter</td><td class="text-end">₹180</td></tr>
          </tbody>
        </table>
      </div>
      <aside class="col-md-4">
        <h5>Chef's Specials</h5>
        <ul class="list-group">
          <li class="list-group-item">Paneer Tikka Masala</li>
          <li class="list-group-item">Lamb Rogan Josh</li>
          <li class="list-group-item">Seafood Platter</li>
        </ul>
        <figure class="figure mt-3">
          <img src="https://via.placeholder.com/350x200" class="figure-img img-fluid rounded" alt="Food">
          <figcaption class="figure-caption text-center">Chef's choice</figcaption>
        </figure>
      </aside>
    </div>
  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
