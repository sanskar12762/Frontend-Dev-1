    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Pricing Plans</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>
      <style>
  .plan-hover { transition: transform .2s; }
  .plan-hover:hover { transform: translateY(-6px); }
</style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <main class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Choose Your Plan</h2>
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-lg plan-hover">
          <div class="card-body">
            <h5 class="card-title">Basic</h5>
            <h6>₹499 / mo</h6>
            <ul>
              <li>Feature A</li>
              <li>Feature B</li>
            </ul>
            <a class="btn btn-outline-primary" href="#">Choose</a>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-lg plan-hover bg-primary text-white">
          <div class="card-body">
            <h5 class="card-title">Pro</h5>
            <h6>₹999 / mo</h6>
            <ul>
              <li>Everything in Basic</li>
              <li>Priority support</li>
            </ul>
            <a class="btn btn-light" href="#">Choose</a>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-lg plan-hover">
          <div class="card-body">
            <h5 class="card-title">Enterprise</h5>
            <h6>Contact us</h6>
            <ul>
              <li>Custom solutions</li>
            </ul>
            <a class="btn btn-outline-primary" href="#">Contact</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
