    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Portfolio - Your Name</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <header class="bg-light py-4">
  <div class="container text-center">
    <h1 class="fw-bold mb-1">Your Name</h1>
    <p class="text-muted mb-3">Web Developer • Data Enthusiast</p>
  </div>
</header>

<main class="py-5">
  <div class="container text-center">
    <img src="https://via.placeholder.com/150" class="img-fluid rounded-circle mb-3" alt="Profile image">
    <div class="mb-3">
      <a class="btn btn-primary me-2" href="#">Hire Me</a>
      <a class="btn btn-outline-secondary" href="#">Download CV</a>
    </div>

    <section class="p-4 bg-light d-inline-block text-start" style="max-width:500px;">
      <form>
        <div class="mb-2">
          <input class="form-control" placeholder="Your name" />
        </div>
        <div class="mb-2">
          <input class="form-control" placeholder="Your email" />
        </div>
        <div>
          <textarea class="form-control" rows="3" placeholder="Message"></textarea>
        </div>
      </form>
    </section>
  </div>
</main>

<footer class="py-3 text-center small text-muted">Contact: you@example.com</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
