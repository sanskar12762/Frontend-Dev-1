    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Custom Themed Blog</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>
      <style>
  :root { --bs-primary: #ff6f61; --bs-body-bg: #fff7f6; --bs-font-sans-serif: 'Inter', sans-serif; }
  .theme-card { border-radius: .6rem; }
</style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <header class="py-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3">The Daily Note</h1>
    <nav><a class="btn btn-sm btn-outline-secondary" href="#">Subscribe</a></nav>
  </div>
</header>

<main class="py-4">
  <div class="container">
    <div class="row g-4">
      <div class="col-md-6">
        <article class="card theme-card p-3">
          <h3>Post Title One</h3>
          <p class="small text-muted">Nov 10, 2025 • Web</p>
          <p>Short excerpt from the post to show layout and theme.</p>
          <a class="btn btn-sm btn-primary" href="#">Read more</a>
        </article>
      </div>
      <div class="col-md-6">
        <article class="card theme-card p-3">
          <h3>Post Title Two</h3>
          <p class="small text-muted">Nov 9, 2025 • Design</p>
          <p>Short excerpt from the post to show layout and theme.</p>
          <a class="btn btn-sm btn-primary" href="#">Read more</a>
        </article>
      </div>
    </div>
  </div>
</main>

<footer class="py-3 text-center small text-muted">© 2025 The Daily Note</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
