    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Notifications Dashboard</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <main class="py-4">
  <div class="container">
    <h2>Notifications</h2>
    <div class="card p-3">
      <div class="alert alert-success" role="alert">
        New message received!
      </div>
      <div class="alert alert-info" role="alert">
        Tip: Try our new feature.
      </div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Warning: Payment overdue.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <section class="mt-3 p-3 bg-light border">
        <h6>Summary</h6>
        <p class="small text-muted mb-0">3 notifications, 1 action required</p>
      </section>
    </div>
  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
