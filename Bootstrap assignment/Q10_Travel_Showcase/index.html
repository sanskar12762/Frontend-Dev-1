    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Travel Showcase</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
      <style>
        :root { --bs-font-sans-serif: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        body { font-family: var(--bs-font-sans-serif); }
      </style>

      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <main>
  <div class="container py-4">
    <h2 class="mb-3">Explore Destinations</h2>

    <div id="travelCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x400?text=Goa" class="d-block w-100" alt="Goa">
          <div class="carousel-caption d-none d-md-block">
            <h5>Goa Beaches</h5>
            <p>Sunny beaches and nightlife.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="4000">
          <img src="https://via.placeholder.com/1200x400?text=Himachal" class="d-block w-100" alt="Hills">
          <div class="carousel-caption d-none d-md-block">
            <h5>Himachal Mountains</h5>
            <p>Cool climate and scenic views.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3500">
          <img src="https://via.placeholder.com/1200x400?text=Kerala" class="d-block w-100" alt="Backwaters">
          <div class="carousel-caption d-none d-md-block">
            <h5>Kerala Backwaters</h5>
            <p>Relaxing houseboat stays.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="mb-4">
      <label class="form-label">Booking completion</label>
      <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 70%;">70%</div>
      </div>
    </div>

    <footer class="mt-4 small text-muted">Contact: travel@agency.com | +91 99999 99999</footer>
  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
