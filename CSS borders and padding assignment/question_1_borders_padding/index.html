<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>
    
    <main class="container">
        <div class="box solid-border">
            <h3>Solid Border</h3>
            <p>This box has a solid border style</p>
        </div>
        
        <div class="box dashed-border">
            <h3>Dashed Border</h3>
            <p>This box has a dashed border style</p>
        </div>
        
        <div class="box double-border">
            <h3>Double Border</h3>
            <p>This box has a double border style</p>
        </div>
        
        <div class="box groove-border">
            <h3>Groove Border</h3>
            <p>This box has a groove border style</p>
        </div>
        
        <div class="box rounded-box">
            <h3>Rounded Corners</h3>
            <p>This box has border-radius applied</p>
        </div>
    </main>
</body>
</html>
