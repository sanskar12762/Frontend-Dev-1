<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Advanced CSS Selectors Demonstration</h1>
    </header>
    
    <main>
        <section class="form-section">
            <h2>Form with Attribute Selectors</h2>
            <form>
                <input type="text" placeholder="Text input">
                <input type="email" placeholder="Email input">
                <input type="password" placeholder="Password input">
            </form>
        </section>
        
        <section class="link-section">
            <h2>Links with Attribute Selectors</h2>
            <ul>
                <li><a href="https://www.google.com">External HTTPS Link</a></li>
                <li><a href="http://example.com">HTTP Link</a></li>
                <li><a href="page.html">Internal Link</a></li>
            </ul>
        </section>
        
        <section class="list-section">
            <h2>List with Pseudo-classes</h2>
            <ul class="styled-list">
                <li>First item</li>
                <li>Second item</li>
                <li>Third item</li>
                <li>Fourth item</li>
                <li>Fifth item</li>
            </ul>
        </section>
    </main>
</body>
</html>
