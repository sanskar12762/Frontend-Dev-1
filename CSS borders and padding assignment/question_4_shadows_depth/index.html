<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Shadows and Depth Effect</h1>
    </header>
    
    <main class="card-container">
        <div class="card card1">
            <h2>Profile Card 1</h2>
            <p>This card has a subtle box-shadow for a gentle depth effect.</p>
        </div>
        
        <div class="card card2">
            <h2>Profile Card 2</h2>
            <p>This card has a moderate box-shadow with text-shadow on the heading.</p>
        </div>
        
        <div class="card card3">
            <h2>Profile Card 3</h2>
            <p>This card has a strong box-shadow for maximum depth perception.</p>
        </div>
    </main>
</body>
</html>
