<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Outline and Focus Styling</h1>
    </header>
    
    <main class="form-container">
        <form>
            <h2>Contact Form</h2>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" class="outline-solid">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" class="outline-dashed">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone" class="outline-dotted">
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Your message here..." class="outline-double"></textarea>
            </div>
            
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
