<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Transformations</h1>
    </header>
    
    <main class="transform-container">
        <div class="transform-box">
            <div class="box rotate-box">
                <h3>ROTATE</h3>
            </div>
            <p class="label">Rotate Transformation</p>
        </div>
        
        <div class="transform-box">
            <div class="box scale-box">
                <h3>SCALE</h3>
            </div>
            <p class="label">Scale Transformation</p>
        </div>
        
        <div class="transform-box">
            <div class="box translate-box">
                <h3>TRANSLATE</h3>
            </div>
            <p class="label">Translate Transformation</p>
        </div>
        
        <div class="transform-box">
            <div class="box skew-box">
                <h3>SKEW</h3>
            </div>
            <p class="label">Skew Transformation</p>
        </div>
    </main>
</body>
</html>
